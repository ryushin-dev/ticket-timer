<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Ticket Timer · Unlock</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6ef;color:#142c26;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:410px;background:white;border:1px solid #d5e0d8;border-radius:20px;padding:34px;box-shadow:0 8px 36px #143c2608}.eyebrow{font-size:11px;letter-spacing:.18em;color:#1b6545;font-weight:700}h1{font-size:31px;letter-spacing:-.04em;margin:8px 0}p{color:#62736c;font-size:13px;margin:0 0 25px}label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}input{width:100%;border:1px solid #c7d5cb;border-radius:9px;padding:12px;font:inherit}input:focus{outline:2px solid #448362;outline-offset:2px}button{margin-top:16px;width:100%;background:#1b6545;color:white;border:0;border-radius:9px;padding:12px;font:600 15px sans-serif;cursor:pointer}button:disabled{opacity:.55}.error{font-size:12px;color:#a7382e;margin-top:14px;min-height:20px}.note{font-size:11px;color:#62736c;margin-top:15px}
</style></head><body><main class="card"><div class="eyebrow">TICKET DISCOVERY / WEB</div><h1>Ticket Timer</h1><p>パスワードを入力して、設定画面を開きます。</p><form id="unlock"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="unlock-button">設定画面を開く</button><div class="error" id="error" role="alert"></div></form><div class="note">パスワードはこのブラウザ内で復号に使い、送信・保存しません。</div></main>
<script id="payload" type="application/json">/* ENCRYPTED_PAYLOAD */</script><script>
document.getElementById('unlock').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('unlock-button'), field = document.getElementById('password'), error = document.getElementById('error');
  if (!window.crypto?.subtle) { error.textContent = 'HTTPSまたはlocalhostで開いてください。'; return; }
  button.disabled = true; button.textContent = '解除中…'; error.textContent = '';
  try {
    const payload = JSON.parse(document.getElementById('payload').textContent);
    const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value), 'PBKDF2', false, ['deriveKey']);
    field.value = '';
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iterations }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv), additionalData: new TextEncoder().encode('ticket-pages-v1') }, key, bytes(payload.ciphertext));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch {
    error.textContent = '解除できませんでした。パスワードを確認してください。';
    button.disabled = false; button.textContent = '設定画面を開く';
  }
});
</script></body></html>
